name: Tests

on:
  push:
    # "*" only matches branch names without a slash, so this never actually fired for
    # this repo's chore/, fix/, feat/, etc. branches, only for main. "**" fixes that.
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

# With push now covering every branch, a same-repo PR's branch fires both push and
# pull_request for the same commit; group those under the branch name so the newer
# run cancels the older one. A fork PR's head branch never triggers push here, so it
# gets its own group keyed by PR number, keeping same-named branches from different
# forks from cancelling each other's runs.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref) || (github.event.pull_request && format('pr-{0}', github.event.pull_request.number)) || github.ref_name }}
  # Never cancel a main run: two quick merges must not leave the first commit's result missing.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv tool install tox --with tox-uv

      - name: Run tox
        run: tox
        timeout-minutes: 2

      # Skip on the template repo itself: the placeholders are intentional there.
      # Scaffolded plugins inherit no exemption and must update pyproject.toml
      # before this check passes. Runs once per workflow (only on the 3.10 leg).
      - name: Check pyproject.toml for template placeholders
        if: matrix.python-version == '3.10' && github.repository != 'mloda-ai/mloda-plugin-template'
        run: tox -e placeholders
        timeout-minutes: 1
