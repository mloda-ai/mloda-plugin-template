[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "placeholder-my-plugin"
# Always start at least at 0.2.0 to make semver work.
# Initial release for semver needs also a manually pushed minimum tag (likely 0.2.0).
version = "0.5.0"
description = "TEMPLATE PLACEHOLDER - Do not install directly. This package reserves the name for mloda-plugin-template. See https://github.com/mloda-ai/mloda-plugin-template"
license = "Apache-2.0"
authors = [{ name = "Your Name placeholder", email = "placeholder@placeholder.com" }]
# mloda capped below 0.17.0 until the next upgrade is evaluated.
dependencies = ["mloda>=0.16.0,<0.17.0", "mloda-testing>=0.10.0"]
requires-python = ">=3.10"
# keywords = ["mloda", "mloda-plugin"]  # off for the name reservation; uncomment for your plugin (customize.sh does this)
# No `License ::` classifier: setuptools rejects it next to the SPDX `license` string.
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# mloda discovers installed plugins through these entry points: each resolves to a
# manifest list of concrete classes. customize.sh rewrites the dotted paths on rename.
[project.entry-points."mloda.feature_groups"]
placeholder = "placeholder.feature_groups.manifest:FEATURE_GROUPS"

[project.entry-points."mloda.compute_frameworks"]
placeholder = "placeholder.compute_frameworks.manifest:COMPUTE_FRAMEWORKS"

[project.entry-points."mloda.extenders"]
placeholder = "placeholder.extenders.manifest:EXTENDERS"

[project.optional-dependencies]
dev = [
    "tox",
    "tox-uv",
    "uv>=0.13.4",
    "pytest",
    "ruff",
    "mypy",
    "bandit",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["placeholder*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["placeholder", "tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[tool.bandit]
exclude_dirs = [".tox", ".venv", "tests"]

[tool.uv]
exclude-newer = "7 days"
# uv is let through early for the 0.13.4 CA store security fix (released 2026-10-20).
# Drop the uv entry on or after 2026-10-28, once that release has cleared the 7-day window.
# virtualenv is let through early for the 21.14.9+ security fixes (21.14.11 released 2026-10-18); drop it on or after 2026-10-26.
exclude-newer-package = { mloda = "2026-12-31", "mloda-testing" = "2026-12-31", "mloda-registry" = "2026-12-31", uv = "2026-10-21", virtualenv = "2026-10-18" }
